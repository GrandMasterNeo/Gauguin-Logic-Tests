name: Zero-origin 11x11 isolated diagnostic
on:
  push:
    branches: [experiment/zero-origin-two-scenarios]
    paths:
      - '.github/workflows/optimized-variant-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-origin-comparison:
    name: 11x11 ${{ matrix.case_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {case_name: seed-one-zero-origin, digits: FIRST_DIGIT_ZERO, seed: '1'}
          - {case_name: seed-zero-minus-one-origin, digits: FIRST_DIGIT_MINUS_ONE, seed: '0'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile diagnostic integration test
        working-directory: upstream/gauguin
        run: ./gradlew :gauguin-core:compileIntegrationTestKotlin --no-daemon --console=plain -Pbuildserver
      - name: Generate 11x11 with detailed diagnostic logging
        working-directory: upstream/gauguin
        env:
          GAUGUIN_MATRIX_SIZE: '11'
          GAUGUIN_MATRIX_DIGIT_SETTING: ${{ matrix.digits }}
          GAUGUIN_MATRIX_DIFFICULTY: MEDIUM
          GAUGUIN_MATRIX_SEED: ${{ matrix.seed }}
          GAUGUIN_MATRIX_MAX_CANDIDATES: '100000'
          GAUGUIN_MATRIX_BUDGET_MS: '60000'
          GAUGUIN_DEBUG_START_MS: '1000'
          GAUGUIN_DEBUG_DEEP_MS: '5000'
          GAUGUIN_DEBUG_REJECTIONS: '1'
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 120s ./gradlew :gauguin-core:integrationTest --tests '*ProgressiveGenerationMatrixTest' --no-daemon --console=plain -Pbuildserver --info --stacktrace > diagnostic.log 2>&1
          rc=$?
          echo "CASE=${{ matrix.case_name }} EXIT=$rc"
          grep -E 'MATRIX_|rejection|reject|unique|solution|DIAGNOSTIC|Exception|FAILED' diagnostic.log | tail -n 150 || true
          tail -n 100 diagnostic.log
          exit "$rc"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-origin-${{ matrix.case_name }}
          path: |
            upstream/gauguin/diagnostic.log
            upstream/gauguin/gauguin-core/build/test-results/integrationTest/**
          if-no-files-found: warn
          retention-days: 7
