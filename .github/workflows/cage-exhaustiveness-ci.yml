name: Independent cage-combination exhaustiveness
on:
  pull_request:
    branches: [logic-safety-review]
    paths:
      - 'upstream/gauguin/gauguin-human-solver/src/integrationTest/kotlin/org/piepmeyer/gauguin/difficulty/human/CageCombinationExhaustivenessTest.kt'
      - 'upstream/gauguin/gauguin-core/src/main/kotlin/org/piepmeyer/gauguin/creation/cage/**'
      - '.github/workflows/cage-exhaustiveness-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cage-oracle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { size: 4, cage_type: "", digits: FIRST_DIGIT_ONE }
          - { size: 4, cage_type: "", digits: FIRST_DIGIT_ZERO }
          - { size: 4, cage_type: "", digits: PRIME_NUMBERS }
          - { size: 9, cage_type: "", digits: FIRST_DIGIT_ONE }
          - { size: 9, cage_type: "", digits: FIRST_DIGIT_ZERO }
          - { size: 9, cage_type: "", digits: PRIME_NUMBERS }
          - { size: 11, cage_type: "DOUBLE_HORIZONTAL", digits: FIRST_DIGIT_ONE }
          - { size: 11, cage_type: "TRIPLE_HORIZONTAL", digits: FIRST_DIGIT_ONE }
          - { size: 11, cage_type: "ANGLE_RIGHT_BOTTOM", digits: FIRST_DIGIT_ONE }
          - { size: 11, cage_type: "SQUARE", digits: FIRST_DIGIT_ONE }
          - { size: 11, cage_type: "FOUR_HORIZONTAL", digits: FIRST_DIGIT_ONE }
          - { size: 11, cage_type: "DOUBLE_HORIZONTAL", digits: FIRST_DIGIT_ZERO }
          - { size: 11, cage_type: "TRIPLE_HORIZONTAL", digits: FIRST_DIGIT_ZERO }
          - { size: 11, cage_type: "ANGLE_RIGHT_BOTTOM", digits: FIRST_DIGIT_ZERO }
          - { size: 11, cage_type: "SQUARE", digits: FIRST_DIGIT_ZERO, shard_index: 0, shard_count: 4 }
          - { size: 11, cage_type: "SQUARE", digits: FIRST_DIGIT_ZERO, shard_index: 1, shard_count: 4 }
          - { size: 11, cage_type: "SQUARE", digits: FIRST_DIGIT_ZERO, shard_index: 2, shard_count: 4 }
          - { size: 11, cage_type: "SQUARE", digits: FIRST_DIGIT_ZERO, shard_index: 3, shard_count: 4 }
          - { size: 11, cage_type: "FOUR_HORIZONTAL", digits: FIRST_DIGIT_ZERO }
          - { size: 11, cage_type: "DOUBLE_HORIZONTAL", digits: PRIME_NUMBERS }
          - { size: 11, cage_type: "TRIPLE_HORIZONTAL", digits: PRIME_NUMBERS }
          - { size: 11, cage_type: "ANGLE_RIGHT_BOTTOM", digits: PRIME_NUMBERS }
          - { size: 11, cage_type: "SQUARE", digits: PRIME_NUMBERS }
          - { size: 11, cage_type: "FOUR_HORIZONTAL", digits: PRIME_NUMBERS }
    name: cage-oracle (${{ matrix.size }}, ${{ matrix.cage_type || 'all geometries' }}, ${{ matrix.digits }}, shard ${{ matrix.shard_index || 0 }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compare independently enumerated cage tuples for size ${{ matrix.size }}
        working-directory: upstream/gauguin
        env:
          GAUGUIN_CAGE_SIZE: ${{ matrix.size }}
          GAUGUIN_CAGE_TYPE: ${{ matrix.cage_type }}
          GAUGUIN_CAGE_DIGITS: ${{ matrix.digits }}
          GAUGUIN_CAGE_SHARD_INDEX: ${{ matrix.shard_index || 0 }}
          GAUGUIN_CAGE_SHARD_COUNT: ${{ matrix.shard_count || 1 }}
        run: ./gradlew :gauguin-human-solver:integrationTest --tests "*CageCombinationExhaustivenessTest" --no-daemon --stacktrace -Pbuildserver
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cage-exhaustiveness-${{ matrix.size }}-${{ matrix.cage_type || 'all' }}-${{ matrix.digits }}-${{ matrix.shard_index || 0 }}
          path: |
            upstream/gauguin/gauguin-human-solver/build/test-results/integrationTest/**
            upstream/gauguin/gauguin-human-solver/build/reports/tests/integrationTest/**
          if-no-files-found: warn
