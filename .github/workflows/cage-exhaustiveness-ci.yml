name: Independent cage-combination exhaustiveness
on:
  pull_request:
    branches: [logic-safety-review]
    paths:
      - 'upstream/gauguin/gauguin-human-solver/src/integrationTest/kotlin/org/piepmeyer/gauguin/difficulty/human/CageCombinationExhaustivenessTest.kt'
      - 'upstream/gauguin/gauguin-core/src/main/kotlin/org/piepmeyer/gauguin/creation/cage/**'
      - '.github/workflows/cage-exhaustiveness-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cage-oracle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { size: 4, cage_type: "" }
          - { size: 9, cage_type: "" }
          - { size: 11, cage_type: DOUBLE_HORIZONTAL }
          - { size: 11, cage_type: TRIPLE_HORIZONTAL }
          - { size: 11, cage_type: ANGLE_RIGHT_BOTTOM }
          - { size: 11, cage_type: SQUARE }
          - { size: 11, cage_type: FOUR_HORIZONTAL }
    name: cage-oracle (${{ matrix.size }}, ${{ matrix.cage_type || 'all geometries' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compare independently enumerated cage tuples for size ${{ matrix.size }}
        working-directory: upstream/gauguin
        env:
          GAUGUIN_CAGE_SIZE: ${{ matrix.size }}
          GAUGUIN_CAGE_TYPE: ${{ matrix.cage_type }}
        run: ./gradlew :gauguin-human-solver:integrationTest --tests "*CageCombinationExhaustivenessTest" --no-daemon --stacktrace -Pbuildserver
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cage-exhaustiveness-${{ matrix.size }}-${{ matrix.cage_type || 'all' }}
          path: |
            upstream/gauguin/gauguin-human-solver/build/test-results/integrationTest/**
            upstream/gauguin/gauguin-human-solver/build/reports/tests/integrationTest/**
          if-no-files-found: warn
