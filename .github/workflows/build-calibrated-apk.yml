name: Build calibrated Gauguin APK

on:
  push:
    paths:
      - 'calibrated/**'
      - '.github/workflows/build-calibrated-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Calibrated APK + tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout calibration patches
        uses: actions/checkout@v4
        with:
          path: patch

      - name: Checkout pinned upstream Gauguin v0.52.1
        uses: actions/checkout@v4
        with:
          repository: meikpiep/gauguin
          ref: v0.52.1
          path: gauguin

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 37 with existing SDK command-line tools
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          printf "SDK: %s, manager: %s\n" "$SDK_ROOT" "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Apply source patches and isolate test app
        run: |
          set -eu
          cd gauguin
          echo "Upstream commit: $(git rev-parse HEAD)"
          cd ..
          rsync -a patch/calibrated/src/ gauguin/
          cp patch/calibrated/tests/CalibrationSmokeTest.kt gauguin/gauguin-human-solver/src/integrationTest/kotlin/org/piepmeyer/gauguin/difficulty/human/CalibrationSmokeTest.kt
          cp patch/calibrated/tests/OperationBalanceIntegrationTest.kt gauguin/gauguin-human-solver/src/integrationTest/kotlin/org/piepmeyer/gauguin/difficulty/human/OperationBalanceIntegrationTest.kt
          cp patch/calibrated/tests/CandidateDistributionIntegrationTest.kt gauguin/gauguin-human-solver/src/integrationTest/kotlin/org/piepmeyer/gauguin/difficulty/human/CandidateDistributionIntegrationTest.kt

          python3 - <<'PY'
          from pathlib import Path
          app = Path("gauguin/gauguin-app/build.gradle.kts")
          s = app.read_text()
          old = 'applicationIdSuffix = ".debug"'
          assert s.count(old) == 1
          s = s.replace(old, 'applicationIdSuffix = ".debug.candidate"')
          app.write_text(s)

          manifest = Path("gauguin/gauguin-app/src/main/AndroidManifest.xml")
          t = manifest.read_text()
          old_label = 'android:label="@string/app_name"'
          assert t.count(old_label) == 1
          manifest.write_text(t.replace(old_label, 'android:label="Gauguin Candidate Test"'))

          gradle = Path("gauguin/gauguin-human-solver/build.gradle.kts")
          t = gradle.read_text()
          anchor = '                implementation(project())'
          assert t.count(anchor) == 1
          t = t.replace(anchor, anchor + '\n                implementation.bundle(libs.bundles.koin)')
          gradle.write_text(t)
          PY

          cd gauguin
          git status --short
          echo "Target: separate install org.piepmeyer.gauguin.debug.candidate"

      - name: Test original core and human solver
        working-directory: gauguin
        run: |
          ./gradlew :gauguin-core:test :gauguin-human-solver:test --no-daemon --no-configuration-cache -Pbuildserver

      - name: Build installable debug APK
        working-directory: gauguin
        run: |
          ./gradlew :gauguin-app:assembleDebug --no-daemon --no-configuration-cache -Pbuildserver

      - name: Inspect package and signature
        run: |
          set -eu
          APK=$(find gauguin/gauguin-app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -s "$APK"
          sha256sum "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          if [ -x "$SDK_ROOT/build-tools/37.0.0/apksigner" ]; then
            "$SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          fi
          if [ -x "$SDK_ROOT/build-tools/37.0.0/aapt" ]; then
            "$SDK_ROOT/build-tools/37.0.0/aapt" dump badging "$APK" | grep 'package:'
          fi
          mkdir -p output
          cp "$APK" output/Gauguin_0.52.1_Candidate_Experimental_Debug.apk
          sha256sum output/Gauguin_0.52.1_Candidate_Experimental_Debug.apk > output/SHA256.txt

      - name: Publish installable APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gauguin-0.52.1-Candidate-Experimental-APK
          path: output/
          if-no-files-found: warn
          retention-days: 30

      - name: Bounded beginner human calibration diagnostic
        if: always()
        working-directory: gauguin
        run: |
          # Original difficulty selection may retry indefinitely when
          # operation weights shift the classical difficulty distribution.
          timeout --signal=TERM --kill-after=15s 420s ./gradlew :gauguin-human-solver:integrationTest --tests '*CalibrationSmokeTest' --no-daemon --no-configuration-cache -Pbuildserver --info

      - name: Bounded 9–11 operation-mix diagnostic
        if: always()
        working-directory: gauguin
        run: |
          # The heavily multiplication-biased generator may take longer
          # to find an Extreme board at the old classical score thresholds.
          # Never allow a difficult seed to block APK publication.
          timeout --signal=TERM --kill-after=15s 600s ./gradlew :gauguin-human-solver:integrationTest --tests '*OperationBalanceIntegrationTest' --no-daemon --no-configuration-cache -Pbuildserver --info

      - name: Bounded Medium/Hard human deduction diagnostic
        if: always()
        working-directory: gauguin
        run: |
          # The first 20-board audit exhausted the 50-minute GitHub job limit.
          # A timeout provides an explicit diagnostic failure, while the APK
          # and baseline tests remain independently available.
          timeout --signal=TERM --kill-after=15s 900s ./gradlew :gauguin-human-solver:integrationTest --tests '*CandidateDistributionIntegrationTest' --no-daemon --no-configuration-cache -Pbuildserver --info

      - name: Publish operation-mix measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gauguin-Balanced-Operation-Audit
          path: gauguin/gauguin-human-solver/build/operation-balance/*.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Publish test diagnostics if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-test-reports
          path: |
            gauguin/gauguin-human-solver/build/reports/tests/
            gauguin/gauguin-core/build/reports/tests/
          if-no-files-found: warn
