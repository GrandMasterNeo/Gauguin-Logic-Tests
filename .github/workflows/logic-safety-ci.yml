name: Gauguin corrected source tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'upstream/gauguin/**'
      - 'patches/**'
      - '.github/workflows/logic-safety-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corrected-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out corrected source and tests
        uses: actions/checkout@v4
      - name: Verify staged patch matches reviewed safety patch
        run: cmp patches/combined-logic-safety.patch audit/provided/Combined_Source_Fixes.patch
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run core and human-solver unit tests
        working-directory: upstream/gauguin
        run: ./gradlew :gauguin-core:test :gauguin-human-solver:test --no-daemon --stacktrace -Pbuildserver
      - name: Collect test reports even if a test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauguin-corrected-source-test-reports
          path: |
            upstream/gauguin/**/build/test-results/test/**
            upstream/gauguin/**/build/reports/tests/**
          if-no-files-found: warn
