name: Bounded human difficulty calibration
on:
  workflow_dispatch:
  push:
    branches: [logic-matrix-audit]
    paths:
      - '.github/workflows/human-difficulty-calibration-ci.yml'
      - 'upstream/gauguin/gauguin-human-solver/src/integrationTest/kotlin/org/piepmeyer/gauguin/difficulty/human/HumanDifficultyCalibrationSampleTest.kt'
permissions:
  contents: read
jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {size: 9, seed: 3}
          - {size: 10, seed: 3}
          - {size: 11, seed: 3}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Sample classical bands and independently verify human deduction
        working-directory: upstream/gauguin
        env:
          GAUGUIN_CAL_SIZE: ${{ matrix.size }}
          GAUGUIN_CAL_SEED: ${{ matrix.seed }}
          GAUGUIN_CAL_LIMIT: '600'
          GAUGUIN_CAL_BUDGET_MS: '90000'
        run: ./gradlew :gauguin-human-solver:integrationTest --tests '*HumanDifficultyCalibrationSampleTest' --no-daemon --console=plain -Pbuildserver
      - name: Publish calibration records
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys, xml.etree.ElementTree as ET
          root = pathlib.Path('upstream/gauguin/gauguin-human-solver/build/test-results/integrationTest')
          records = []
          for path in root.glob('TEST-*HumanDifficultyCalibrationSampleTest.xml'):
              tree = ET.parse(path)
              for element in tree.iter():
                  if element.tag in ('system-out','system-err') and element.text:
                      records.extend(re.findall(r'CAL_(?:THRESHOLDS|CASE|SUMMARY)[^\r\n]*', element.text))
          records = list(dict.fromkeys(records))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Classical versus deduction-only calibration (bounded diagnostic)\n\n')
              for record in records:
                  if record.startswith(('CAL_SUMMARY','CAL_THRESHOLDS')):
                      out.write('- `' + record + '`\n')
          for record in records:
              print(record)
          if len([r for r in records if r.startswith('CAL_SUMMARY')]) != 5:
              print('CAL_REPORTING_INCOMPLETE: expected five bands; do not infer success',file=sys.stderr)
              sys.exit(1)
          PY
      - name: Archive JUnit calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-calibration-${{ matrix.size }}-seed-${{ matrix.seed }}
          path: |
            upstream/gauguin/gauguin-human-solver/build/test-results/integrationTest/**
            upstream/gauguin/gauguin-human-solver/build/reports/tests/integrationTest/**
          if-no-files-found: warn
