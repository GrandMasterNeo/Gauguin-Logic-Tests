name: Human logic and difficulty matrix (diagnostic)
on:
  pull_request:
    branches: [logic-safety-review]
    paths:
      - 'upstream/gauguin/gauguin-human-solver/**'
      - '.github/workflows/logic-matrix-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  human-matrix:
    strategy:
      fail-fast: false
      matrix:
        size: [4, 9, 10, 11]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify registry contains 37 strategies
        if: matrix.size == 4
        working-directory: upstream/gauguin
        run: ./gradlew :gauguin-human-solver:test --tests "*HumanSolverRegistryAuditTest" --no-daemon -Pbuildserver
      - name: Run seeded safety and difficulty audit (no answer reveals)
        working-directory: upstream/gauguin
        env:
          GAUGUIN_AUDIT_SIZE: ${{ matrix.size }}
        run: ./gradlew :gauguin-human-solver:integrationTest --tests "*HumanLogicDifficultyMatrixTest" --no-daemon --stacktrace -Pbuildserver
      - name: Preserve JUnit and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-logic-matrix-${{ matrix.size }}
          path: |
            upstream/gauguin/gauguin-human-solver/build/test-results/**
            upstream/gauguin/gauguin-human-solver/build/reports/tests/**
          if-no-files-found: warn
