name: Corrected Gauguin source tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'upstream/gauguin/**'
      - '.github/workflows/corrected-source-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run original core and human-solver tests
        working-directory: upstream/gauguin
        run: ./gradlew :gauguin-core:test :gauguin-human-solver:test --no-daemon --stacktrace -Pbuildserver
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-source-test-reports
          path: |
            upstream/gauguin/**/build/test-results/**
            upstream/gauguin/**/build/reports/tests/**
          if-no-files-found: warn
