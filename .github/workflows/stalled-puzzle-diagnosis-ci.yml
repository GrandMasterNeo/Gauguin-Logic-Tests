name: Stalled puzzle diagnosis (no production changes)
on:
  pull_request:
    branches: [logic-safety-review]
    paths:
      - 'upstream/gauguin/gauguin-human-solver/src/integrationTest/kotlin/org/piepmeyer/gauguin/difficulty/human/StalledPuzzleDiagnosisTest.kt'
      - '.github/workflows/stalled-puzzle-diagnosis-ci.yml'
  push:
    branches: [logic-matrix-audit]
    paths:
      - 'upstream/gauguin/gauguin-human-solver/src/integrationTest/kotlin/org/piepmeyer/gauguin/difficulty/human/StalledPuzzleDiagnosisTest.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stalled-puzzles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {size: 10, level: MEDIUM, seed: 0}
          - {size: 10, level: HARD, seed: 0}
          - {size: 10, level: EASY, seed: 10}
          - {size: 10, level: EASY, seed: 23}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Capture bounded generation-worker JVM snapshots
        shell: bash
        run: |
          # Capture before the observed ~14-16 minute coroutine timeout.
          # Each snapshot includes all JVMs because the Gradle test worker PID
          # is not reliably the same as the Gradle launcher PID.
          nohup bash -c '
            for attempt in 1 2 3 4; do
              sleep 180
              echo "STALL_THREAD_SNAPSHOT attempt=$attempt timestamp=$(date -u +%FT%TZ)"
              for pid in $(jps -q 2>/dev/null || true); do
                echo "STALL_THREAD_PID attempt=$attempt pid=$pid"
                timeout 15s jcmd "$pid" Thread.print -l 2>&1 | head -n 500 || true
              done
            done
          ' > stalled-thread-diagnostics.log 2>&1 < /dev/null &
      - name: Reproduce stalled case using production HumanSolver and sample human-solvability gate
        working-directory: upstream/gauguin
        env:
          GAUGUIN_STALL_SIZE: ${{ matrix.size }}
          GAUGUIN_STALL_RETRIES: '2'
          GAUGUIN_STALL_LEVEL: ${{ matrix.level }}
          GAUGUIN_STALL_SEED: ${{ matrix.seed }}
        run: |
          set -o pipefail
          ./gradlew :gauguin-human-solver:integrationTest --tests "*StalledPuzzleDiagnosisTest" --no-daemon --stacktrace --console=plain -Pbuildserver 2>&1 | tee "$GITHUB_WORKSPACE/stalled-console.log"
      - name: Publish reproducible stalled-puzzle diagnostics
        if: always()
        shell: bash
        env:
          GAUGUIN_STALL_SIZE: ${{ matrix.size }}
          GAUGUIN_STALL_LEVEL: ${{ matrix.level }}
          GAUGUIN_STALL_SEED: ${{ matrix.seed }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path("upstream/gauguin/gauguin-human-solver/build/test-results")
          patterns = re.compile(r"(?:STALL_REPRO|STALL_GENERATION_INITIAL|STALL_GATE_TRIAL|STALL_GATE_SUMMARY|STALL_GATE_OUTCOME|STALL_DEDUCTION_COMPLIANCE|STALL_CAGE_FRONTIER|STALL_PHASE)[^\r\n]*")
          records = []
          for path in root.rglob("*.xml"):
              try:
                  tree = ET.parse(path)
              except ET.ParseError:
                  continue
              for element in tree.iter():
                  if element.tag in ("system-out", "system-err") and element.text:
                      records.extend(patterns.findall(element.text))
          console = pathlib.Path("stalled-console.log")
          if console.exists():
              records.extend(patterns.findall(console.read_text(encoding="utf-8", errors="replace")))
          phase_records = [record for record in records if record.startswith("STALL_PHASE ") and "tag=original " in record]
          records = sorted(set(records))
          board = int(os.environ["GAUGUIN_STALL_SIZE"])
          expected = {(board, os.environ["GAUGUIN_STALL_LEVEL"], int(os.environ["GAUGUIN_STALL_SEED"]))}
          seen = set()
          for record in records:
              if not record.startswith("STALL_REPRO tag=original "):
                  continue
              match = re.search(r"board=(\d+) level=(\w+) seed=(\d+)", record)
              if match:
                  seen.add((int(match.group(1)), match.group(2), int(match.group(3))))
          compliance_seen = set()
          for record in records:
              if not record.startswith("STALL_DEDUCTION_COMPLIANCE tag=original "):
                  continue
              match = re.search(r"board=(\d+) level=(\w+) seed=(\d+)", record)
              if match:
                  compliance_seen.add((int(match.group(1)), match.group(2), int(match.group(3))))
          reporting_ok = seen == expected and compliance_seen == expected
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Stalled-puzzle diagnostics\n\n")
              if records:
                  for record in records:
                      out.write("- `" + record.strip() + "`\n")
              else:
                  out.write("No STALL diagnostic records found in JUnit XML; inspect uploaded reports.\n")
          for record in records:
              print(record)
          if not reporting_ok:
              print(f"STALL_REPORTING_INCOMPLETE board={board} expected={sorted(expected)} seen={sorted(seen)} complianceSeen={sorted(compliance_seen)} lastPhase={phase_records[-1] if phase_records else 'none'}", file=sys.stderr)
              print("ERROR: incomplete diagnostic reporting; do not classify as mathematical failure", file=sys.stderr)
              sys.exit(1)
          print(f"STALL_REPORTING_VERIFIED board={board} originalCases={len(seen)}")
          PY
      - name: Archive reports and console logs as JUnit attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stalled-diagnosis-${{ matrix.size }}-${{ matrix.level }}-${{ matrix.seed }}
          path: |
            upstream/gauguin/gauguin-human-solver/build/test-results/integrationTest/**
            upstream/gauguin/gauguin-human-solver/build/reports/tests/integrationTest/**
            stalled-console.log
            stalled-thread-diagnostics.log
          if-no-files-found: warn
