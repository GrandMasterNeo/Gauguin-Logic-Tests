name: Gauguin completion relay

on:
  workflow_run:
    workflows:
      - "Advanced human strategy safety (Medium Hard Extreme)"
      - "Beginner human-solvability gate benchmark (diagnostic)"
      - "Build installable Gauguin debug APK (audit)"
      - "Independent cage-combination exhaustiveness"
      - "Classical threshold sensitivity (diagnostic)"
      - "Enumerated all-solution soundness audit"
      - "Expanded default-generator human difficulty sweep (diagnostic)"
      - "Bounded Extreme generator stage profile (diagnostic only)"
      - "Bounded human difficulty calibration"
      - "Human logic and difficulty matrix (diagnostic)"
      - "Gauguin corrected source tests"
      - "Experimental merging generator comparison"
      - "Rare strategy candidate oracle"
      - "Recalibrated threshold verification"
      - "Seeded generation feedback test"
      - "Stalled puzzle diagnosis (no production changes)"
      - "Targeted Hard and Very Hard verification"
      - "All 37 strategy two-solution oracle"
    types: [completed]

permissions: {}

jobs:
  notify:
    if: github.event.workflow_run.head_branch == 'logic-matrix-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Tasker
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test -n "$TOPIC"
          printf 'Gauguin test completed. Workflow: %s. Result: %s. Run URL: %s. Run ID: %s. Review results and continue testing.\n' "$RUN_NAME" "$RESULT" "$RUN_URL" "$RUN_ID" |
            curl -fsS --retry 3 \
              -H "Title: GAUGUIN_DONE" \
              --data-binary @- "https://ntfy.sh/$TOPIC"
