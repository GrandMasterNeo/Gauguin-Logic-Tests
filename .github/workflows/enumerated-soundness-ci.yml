name: Enumerated all-solution soundness audit
on:
  pull_request:
    branches: [logic-safety-review]
    paths:
      - 'upstream/gauguin/gauguin-human-solver/src/integrationTest/kotlin/org/piepmeyer/gauguin/difficulty/human/EnumeratedSolutionSoundnessTest.kt'
      - 'upstream/gauguin/gauguin-human-solver/src/main/kotlin/org/piepmeyer/gauguin/difficulty/human/strategy/**'
      - 'upstream/gauguin/gauguin-human-solver/src/test/kotlin/org/piepmeyer/gauguin/difficulty/human/strategy/SinglePossibleInLineStaleCandidateTest.kt'
      - '.github/workflows/enumerated-soundness-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prevent duplicate hidden-single placement with stale candidates
        working-directory: upstream/gauguin
        run: ./gradlew :gauguin-human-solver:test --tests "*SinglePossibleInLineStaleCandidateTest" --no-daemon --stacktrace -Pbuildserver
      - name: Enumerate 4x4 Latin squares and verify every feasible solution after each strategy
        working-directory: upstream/gauguin
        env:
          GAUGUIN_ENUMERATED_VARIATIONS: '32'
        run: ./gradlew :gauguin-human-solver:integrationTest --tests "*EnumeratedSolutionSoundnessTest" --no-daemon --stacktrace -Pbuildserver
      - name: Preserve JUnit model-checking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enumerated-soundness-4x4
          path: |
            upstream/gauguin/gauguin-human-solver/build/test-results/integrationTest/**
            upstream/gauguin/gauguin-human-solver/build/reports/tests/integrationTest/**
          if-no-files-found: warn
