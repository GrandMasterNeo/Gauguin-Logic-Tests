name: Classical threshold sensitivity (diagnostic)
on:
  push:
    branches: [logic-matrix-audit]
    paths: ['.github/workflows/classical-threshold-sensitivity-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    strategy:
      fail-fast: false
      matrix:
        size: [10, 11]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Profile classical threshold sensitivity
        working-directory: upstream/gauguin
        env:
          GAUGUIN_PROFILE_SIZE: ${{ matrix.size }}
          GAUGUIN_PROFILE_SEED: '2'
          GAUGUIN_PROFILE_MAX_CANDIDATES: '2000'
          GAUGUIN_PROFILE_BUDGET_MS: '30000'
        run: ./gradlew :gauguin-core:integrationTest --tests '*ExtremeGenerationRejectionProfileTest' --no-daemon --console=plain -Pbuildserver
      - name: Verify calibration summary exists
        if: success()
        working-directory: upstream/gauguin
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob('gauguin-core/build/test-results/integrationTest/TEST-*.xml')
          records=[]
          for f in files:
              root=ET.parse(f).getroot()
              for node in root.iter('system-out'):
                  records.extend((node.text or '').splitlines())
          assert any(line.startswith('PROFILE_CALIBRATION size=') for line in records), 'Missing PROFILE_CALIBRATION in JUnit XML'
          assert any(line.startswith('PROFILE_SUMMARY size=') for line in records), 'Missing PROFILE_SUMMARY in JUnit XML'
          print(*[line for line in records if line.startswith(('PROFILE_CALIBRATION size=','PROFILE_SUMMARY size='))],sep='\n')
          PY
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threshold-sensitivity-${{ matrix.size }}
          path: upstream/gauguin/gauguin-core/build/test-results/integrationTest/**
          if-no-files-found: warn
