name: Isolated empirical difficulty progression baseline
on:
  push:
    branches: [experiment/difficulty-progression-baseline]
    paths: ['.github/workflows/isolated-progression-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        size: [9, 10, 11]
        seed: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Sample original difficulty bands and deduction-only solvability
        working-directory: upstream/gauguin
        env:
          GAUGUIN_CAL_SIZE: ${{ matrix.size }}
          GAUGUIN_CAL_SEED: ${{ matrix.seed }}
          GAUGUIN_CAL_LIMIT: '600'
          GAUGUIN_CAL_BUDGET_MS: '60000'
        run: ./gradlew :gauguin-human-solver:integrationTest --tests '*HumanDifficultyCalibrationSampleTest' --no-daemon --console=plain -Pbuildserver
      - name: Print compact calibration results
        if: always()
        working-directory: upstream/gauguin
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('gauguin-human-solver/build/test-results/integrationTest/TEST-*.xml'):
              try: root=ET.parse(f).getroot()
              except ET.ParseError: continue
              for node in root.iter('system-out'):
                  for line in (node.text or '').splitlines():
                      if line.startswith(('CAL_THRESHOLDS ', 'CAL_STAGE_TIMES ', 'CAL_SUMMARY ')):
                          print(line)
          PY
