name: All 37 strategy two-solution oracle
on:
  pull_request:
    branches: [logic-safety-review]
    paths:
      - 'upstream/gauguin/gauguin-human-solver/src/integrationTest/kotlin/org/piepmeyer/gauguin/difficulty/human/AllStrategyTwoSolutionsOracleTest.kt'
      - 'upstream/gauguin/gauguin-human-solver/src/main/kotlin/org/piepmeyer/gauguin/difficulty/human/strategy/nishio/NishioCore.kt'
      - 'upstream/gauguin/gauguin-human-solver/src/test/kotlin/org/piepmeyer/gauguin/difficulty/human/strategy/nishio/NishioMissingContradictionRegressionTest.kt'
      - '.github/workflows/two-solutions-oracle-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-strategies-multiple-solutions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify missed contradiction regressions in both Nishio strategies
        working-directory: upstream/gauguin
        run: ./gradlew :gauguin-human-solver:test --tests "*NishioMissingContradictionRegressionTest" --no-daemon --stacktrace -Pbuildserver
      - name: Check all 37 strategies against two simultaneously valid solutions
        working-directory: upstream/gauguin
        env:
          GAUGUIN_TWO_SOLUTIONS_VARIATIONS: '12'
        run: ./gradlew :gauguin-human-solver:integrationTest --tests "*AllStrategyTwoSolutionsOracleTest" --no-daemon --stacktrace -Pbuildserver
      - name: Archive JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-strategies-two-solutions
          path: |
            upstream/gauguin/gauguin-human-solver/build/test-results/integrationTest/**
            upstream/gauguin/gauguin-human-solver/build/reports/tests/integrationTest/**
          if-no-files-found: warn
