name: Generator constraint hardening regression
on:
  push:
    branches: [experiment/generator-constraint-hardening]
    paths:
      - upstream/gauguin/**
      - .github/workflows/generator-constraint-hardening.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run core and human solver unit tests
        working-directory: upstream/gauguin
        run: |
          set -o pipefail
          ./gradlew :gauguin-core:test :gauguin-human-solver:test --rerun-tasks --no-daemon --console=plain -Pbuildserver 2>&1 | tee /tmp/generator-constraint-unit.log
      - name: Reproduce previously passing 11x11 Hard seed 5 with debug
        working-directory: upstream/gauguin
        env:
          GAUGUIN_MATRIX_SIZE: '11'
          GAUGUIN_MATRIX_DIFFICULTY: HARD
          GAUGUIN_MATRIX_DIGIT_SETTING: FIRST_DIGIT_ZERO
          GAUGUIN_MATRIX_SEED: '5'
          GAUGUIN_MATRIX_BUDGET_MS: '60000'
          GAUGUIN_MATRIX_MAX_CANDIDATES: '100000'
          GAUGUIN_DEBUG_START_MS: '1000'
          GAUGUIN_DEBUG_DEEP_MS: '5000'
          GAUGUIN_DEBUG_REJECTIONS: '1'
        run: |
          set -o pipefail
          ./gradlew :gauguin-core:integrationTest --tests '*ProgressiveGenerationMatrixTest' --rerun-tasks --no-daemon --console=plain -Pbuildserver --info 2>&1 | tee /tmp/generator-constraint-regression.log
      - name: Save bounded diagnostics
        if: always()
        run: |
          mkdir -p reports
          if [ -f /tmp/generator-constraint-unit.log ]; then tail -c 100000 /tmp/generator-constraint-unit.log > reports/unit-debug.log; fi
          if [ -f /tmp/generator-constraint-regression.log ]; then tail -c 250000 /tmp/generator-constraint-regression.log > reports/integration-debug.log; fi
          printf 'commit=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > reports/run-metadata.txt
          printf 'humanCertification=NOT_EVALUATED\n' >> reports/run-metadata.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-constraint-regression
          path: |
            reports/
            upstream/gauguin/gauguin-core/build/test-results/
            upstream/gauguin/gauguin-human-solver/build/test-results/
          if-no-files-found: warn
          retention-days: 14
