name: 11x11 zero-start Hard and Very Hard seeds 0-10
on:
  push:
    branches: [experiment/autonomous-generation-lab]
    paths: ['.github/workflows/11x11-zero-hard-seeds-0-10.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-sweep:
    name: 11x11 0-10 digits ${{ matrix.difficulty }} seeds 0-10
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        difficulty: [HARD, VERY_HARD]
    env:
      GAUGUIN_MATRIX_SIZE: '11'
      GAUGUIN_MATRIX_DIGIT_SETTING: FIRST_DIGIT_ZERO
      GAUGUIN_MATRIX_DIFFICULTY: ${{ matrix.difficulty }}
      GAUGUIN_MATRIX_MAX_CANDIDATES: '100000'
      GAUGUIN_MATRIX_BUDGET_MS: '60000'
      GAUGUIN_DEBUG_START_MS: '1000'
      GAUGUIN_DEBUG_DEEP_MS: '5000'
      GAUGUIN_DEBUG_REJECTIONS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile integration tests
        working-directory: upstream/gauguin
        run: ./gradlew :gauguin-core:compileIntegrationTestKotlin --no-daemon --console=plain -Pbuildserver
      - name: Independently execute sequential seeds 0 through 10
        working-directory: upstream/gauguin
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p seed-reports
          echo 'seed,difficulty,digitSetting,exitCode,solutions,actual,resultStatus' > seed-reports/summary.csv
          failures=0
          for seed in {0..10}; do
            export GAUGUIN_MATRIX_SEED="$seed"
            rm -rf gauguin-core/build/test-results/integrationTest
            echo "::group::Seed $seed difficulty $GAUGUIN_MATRIX_DIFFICULTY"
            timeout --signal=TERM --kill-after=5s 240s ./gradlew :gauguin-core:integrationTest --tests '*ProgressiveGenerationMatrixTest' --no-daemon --console=plain -Pbuildserver --info --rerun-tasks > "seed-reports/seed-$seed.log" 2>&1
            rc=$?
            result=$(grep -oh 'MATRIX_RESULT [^<]*' gauguin-core/build/test-results/integrationTest/TEST-*ProgressiveGenerationMatrixTest*.xml 2>/dev/null | head -1 || true)
            [ -n "$result" ] || result=$(grep -m1 'MATRIX_RESULT ' "seed-reports/seed-$seed.log" || true)
            solutions=$(printf '%s' "$result" | grep -oE 'solutions=[0-9]+' | head -1 | cut -d= -f2 || true)
            actual=$(printf '%s' "$result" | grep -oE 'actual=[A-Z_]+' | head -1 | cut -d= -f2 || true)
            status=PASS_UNIQUENESS
            if [ "$rc" -ne 0 ] || [ -z "$result" ] || [ "${solutions:-0}" -ne 1 ] || [[ "$result" != *"size=11 "* ]] || [[ "$result" != *"difficulty=$GAUGUIN_MATRIX_DIFFICULTY "* ]] || [[ "$result" != *"seed=$seed "* ]] || [[ "$result" != *"digitSetting=FIRST_DIGIT_ZERO "* ]]; then
              status=FAIL
              failures=$((failures+1))
            fi
            echo "$seed,$GAUGUIN_MATRIX_DIFFICULTY,FIRST_DIGIT_ZERO,$rc,${solutions:-0},${actual:-NA},$status" >> seed-reports/summary.csv
            { echo "commit=$GITHUB_SHA"; echo "seed=$seed"; echo "difficulty=$GAUGUIN_MATRIX_DIFFICULTY"; echo "digitSetting=FIRST_DIGIT_ZERO"; echo "exitCode=$rc"; echo "result=$result"; grep -m1 'Generation budget exhausted:' "seed-reports/seed-$seed.log" || true; } > "seed-reports/seed-$seed-report.txt"
            tail -n 12 "seed-reports/seed-$seed.log"
            tail -c 250000 "seed-reports/seed-$seed.log" > "seed-reports/seed-$seed.bounded" && mv "seed-reports/seed-$seed.bounded" "seed-reports/seed-$seed.log"
            echo "SEED_RESULT seed=$seed difficulty=$GAUGUIN_MATRIX_DIFFICULTY status=$status exit=$rc $result"
            echo "::endgroup::"
          done
          cat seed-reports/summary.csv
          [ "$failures" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 11x11-zero-seeds-0-10-${{ matrix.difficulty }}
          path: upstream/gauguin/seed-reports/
          if-no-files-found: warn
