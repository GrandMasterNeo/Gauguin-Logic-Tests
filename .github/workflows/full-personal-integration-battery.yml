name: Full 3x3-11x11 five-difficulty integration battery
on:
  push:
    branches: [experiment/personal-logic-integration]
    paths: ['.github/workflows/full-personal-integration-battery.yml', 'upstream/gauguin/gauguin-core/src/integrationTest/kotlin/org/piepmeyer/gauguin/creation/ProgressiveGenerationMatrixTest.kt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    name: ${{ matrix.size }}x${{ matrix.size }} full difficulty sweep
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        size: [3, 4, 5, 6, 7, 8, 9, 10, 11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preserved experimental difficulty thresholds and arithmetic weights
        working-directory: upstream/gauguin
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ratings = json.loads(Path('gauguin-core/src/main/resources/org/piepmeyer/gauguin/difficulty/difficulty-ratings.yml').read_text())
          expected = {10: (82, 89, 94, 98), 11: (99, 108, 114, 119)}
          for size, values in expected.items():
              matches = [entry for entry in ratings if entry['variant']['gridSize'] == {'width': size, 'height': size}
                         and entry['variant']['showOperators']
                         and entry['variant']['cageOperation'] == 'OPERATIONS_ALL'
                         and entry['variant']['digitSetting'] == 'FIRST_DIGIT_ONE'
                         and entry['variant']['singleCageUsage'] == 'FIXED_NUMBER']
              assert len(matches) == 1, (size, len(matches))
              actual = tuple(matches[0]['threshold' + label] for label in ('Easy', 'Medium', 'Hard', 'Extreme'))
              assert actual == values, (size, actual, values)
          code = Path('gauguin-core/src/main/kotlin/org/piepmeyer/gauguin/creation/cage/GridCageOperationDecider.kt').read_text()
          for action, weight in (('MULTIPLY', '65.0'), ('ADD', '16.0'), ('SUBTRACT', '8.0'), ('DIVIDE', '11.0')):
              assert f'GridCageAction.ACTION_{action} to {weight}' in code, action
          print('Experimental calibration preserved: 10x10, 11x11 thresholds and 65/16/8/11 operation weights')
          PY
      # Exercise the production calculator and its full acceptance gates.
      # Integration test suite explicitly includes Koin on its compile classpath.
      - name: Run all five difficulty levels with independent bounded cells
        shell: bash
        working-directory: upstream/gauguin
        run: |
          set -uo pipefail
          echo 'size,difficulty,seed,status,solutions,humanCertified' > matrix-results.csv
          failures=0
          for difficulty in VERY_EASY EASY MEDIUM HARD EXTREME; do
            export GAUGUIN_MATRIX_SIZE="${{ matrix.size }}" GAUGUIN_MATRIX_DIFFICULTY="$difficulty" GAUGUIN_MATRIX_SEED=0
            export GAUGUIN_MATRIX_MAX_CANDIDATES=100000 GAUGUIN_MATRIX_BUDGET_MS=60000
            rm -rf gauguin-core/build/test-results/integrationTest
            set +e
            timeout --signal=TERM --kill-after=5s 120s ./gradlew :gauguin-core:integrationTest --tests '*ProgressiveGenerationMatrixTest' --rerun-tasks --no-daemon --console=plain -Pbuildserver --quiet > cell.log 2>&1
            rc=$?
            set -e
            result=$(grep -oh 'MATRIX_RESULT [^<]*' gauguin-core/build/test-results/integrationTest/TEST-*ProgressiveGenerationMatrixTest*.xml 2>/dev/null | head -1 || true)
            [ -n "$result" ] || result=$(grep -m1 'MATRIX_RESULT ' cell.log || true)
            solutions=$(printf '%s' "$result" | grep -oE 'solutions=[0-9]+' | head -1 | cut -d= -f2 || true)
            status=PASS_PRODUCTION_UNIQUENESS
            if [ "$rc" -ne 0 ] || [ -z "$result" ] || [ "${solutions:-0}" -ne 1 ]; then
              status=FAIL
              if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then status=TIMEOUT; fi
              failures=$((failures+1))
            fi
            echo "${{ matrix.size }},$difficulty,0,$status,${solutions:-0},false" >> matrix-results.csv
            echo "CELL ${{ matrix.size }} $difficulty $status exit=$rc $result"
            if [ "$status" != "PASS_DIAGNOSTIC_ONLY" ]; then
              echo "::group::Failure diagnostics ${{ matrix.size }}x${{ matrix.size }} $difficulty"
              tail -n 100 cell.log
              echo "::endgroup::"
            fi
            tail -n 12 cell.log || true
          done
          cat matrix-results.csv
          if [ "$failures" -gt 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-matrix-${{ matrix.size }}x${{ matrix.size }}
          path: upstream/gauguin/matrix-results.csv
          if-no-files-found: warn
