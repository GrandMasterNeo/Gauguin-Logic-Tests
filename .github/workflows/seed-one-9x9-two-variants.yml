name: Isolated seed 1 11x11 two digit variants
on:
  push:
    branches: [experiment/seed-one-11x11-two-variants]
    paths:
      - '.github/workflows/seed-one-11x11-two-variants.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-one:
    name: 11x11 seed 1 ${{ matrix.digits }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        digits: [FIRST_DIGIT_ZERO, FIRST_DIGIT_MINUS_FIVE]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile integration tests
        working-directory: upstream/gauguin
        run: ./gradlew :gauguin-core:compileIntegrationTestKotlin --no-daemon --console=plain -Pbuildserver
      - name: Generate 11x11 Medium using seed 1
        working-directory: upstream/gauguin
        env:
          GAUGUIN_MATRIX_SIZE: '11'
          GAUGUIN_MATRIX_DIFFICULTY: MEDIUM
          GAUGUIN_MATRIX_DIGIT_SETTING: ${{ matrix.digits }}
          GAUGUIN_MATRIX_SEED: '1'
          GAUGUIN_MATRIX_BUDGET_MS: '60000'
          GAUGUIN_MATRIX_MAX_CANDIDATES: '100000'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 120s ./gradlew :gauguin-core:integrationTest --tests '*ProgressiveGenerationMatrixTest' --no-daemon --console=plain -Pbuildserver --info 2>&1 | tee seed-one.log
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seed-one-11x11-${{ matrix.digits }}
          path: upstream/gauguin/seed-one.log
          if-no-files-found: warn
